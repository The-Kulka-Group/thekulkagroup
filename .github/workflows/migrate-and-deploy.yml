# LA-2299. When a merge to main adds a migration, apply it to the production
# database, then ask Vercel to rebuild production.
#
# Why: the production build runs scripts/check-migrations-applied.mjs first and
# stops if a migration is missing, keeping the previous deployment live. That
# guard stays. This workflow removes the two manual steps that followed it
# (`supabase db push`, then a redeploy). Vercel's own build for the same merge
# may still start first and stop at the guard; the deploy hook below rebuilds
# once the schema is in place.
#
# Secrets (repository settings, Actions):
#   SUPABASE_ACCESS_TOKEN   a Supabase personal access token. The CLI uses it to
#                           open a short-lived login role, so no database
#                           password is stored here (the same way a local
#                           `supabase db push` runs after `supabase login`).
#   VERCEL_DEPLOY_HOOK_URL  a deploy hook for the main branch, from the Vercel
#                           project's Git settings

name: Apply migrations and deploy

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: production-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$VERCEL_DEPLOY_HOOK_URL" ] || missing="$missing VERCEL_DEPLOY_HOOK_URL"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets:$missing"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Apply migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Names the project without `supabase link`, which also reads auth,
          # storage and network settings the token is not allowed to see.
          SUPABASE_PROJECT_ID: dpwhxfvwstqszzzkxgdv
        # GitHub runners have no IPv6, so the direct database host is
        # unreachable. When it is, the CLI (internal/utils/flags/db_url.go)
        # falls back to the IPv4 pooler saved at supabase/.temp/pooler-url,
        # the file `supabase link` would write. It holds no password: the CLI
        # logs in with a short-lived role made from the access token.
        run: |
          mkdir -p supabase/.temp
          printf '%s' 'postgresql://postgres.dpwhxfvwstqszzzkxgdv@aws-0-us-east-1.pooler.supabase.com:5432/postgres' > supabase/.temp/pooler-url
          supabase db push --linked --yes

      - name: Rebuild production
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK_URL"
